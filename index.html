<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊涵杰 - 电子名片</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: rotateY(10deg);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .title {
            font-size: 14px;
            color: #667eea;
            font-weight: 600;
        }

        .info-section {
            margin: 30px 0;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin: 15px 0;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: background 0.3s;
        }

        .info-item:hover {
            background: #e9ecef;
        }

        .info-icon {
            font-size: 20px;
            margin-right: 15px;
            color: #667eea;
            min-width: 30px;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .qr-section {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px dashed #ddd;
        }

        .qr-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #qrcode {
            display: inline-block;
            padding: 10px;
            background: white;
            border-radius: 10px;
            border: 2px solid #f0f0f0;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-call {
            background: #667eea;
            color: white;
        }

        .btn-call:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-download {
            background: #764ba2;
            color: white;
        }

        .btn-download:hover {
            background: #654a8e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }

            .name {
                font-size: 24px;
            }

            .btn {
                font-size: 13px;
                padding: 10px 15px;
            }
        }

        @media print {
            body {
                background: white;
            }

            .card {
                box-shadow: none;
                max-width: 100%;
            }

            .action-buttons {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <!-- 头部信息 -->
            <div class="header">
                <div class="avatar">熊</div>
                <div class="name">熊涵杰</div>
                <div class="title">健身爱好者</div>
            </div>

            <!-- 联系信息 -->
            <div class="info-section">
                <div class="info-item">
                    <div class="info-icon">📱</div>
                    <div class="info-content">
                        <div class="info-label">电话</div>
                        <div class="info-value">19970539666</div>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">💪</div>
                    <div class="info-content">
                        <div class="info-label">爱好</div>
                        <div class="info-value">健身</div>
                    </div>
                </div>
            </div>

            <!-- 二维码部分 -->
            <div class="qr-section">
                <div class="qr-label">扫描联系我</div>
                <div id="qrcode"></div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons">
                <a href="tel:19970539666" class="btn btn-call">
                    📞 拨号
                </a>
                <button class="btn btn-download" onclick="downloadCard()">
                    ⬇️ 保存
                </button>
            </div>
        </div>
    </div>

    <script>
        // 生成二维码 - 扫描后拨号
        const phoneNumber = "19970539666";
        const qrcodeText = `tel:${phoneNumber}`;
        
        const qrcodeElement = document.getElementById('qrcode');
        new QRCode(qrcodeElement, {
            text: qrcodeText,
            width: 150,
            height: 150,
            colorDark: "#667eea",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // 下载名片为图片
        function downloadCard() {
            const card = document.querySelector('.card');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 使用 html2canvas 库（更好的方案）
            if (typeof html2canvas === 'undefined') {
                alert('正在准备下载功能...');
                // 加载 html2canvas 库
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                script.onload = performDownload;
                document.head.appendChild(script);
            } else {
                performDownload();
            }
        }

        function performDownload() {
            html2canvas(document.querySelector('.card'), {
                backgroundColor: '#ffffff',
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = '熊涵杰-名片.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
